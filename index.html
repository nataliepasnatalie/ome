<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>xX_EMO_BANK_2007_Xx — Мобильный банк</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="stage">
    <!-- Desktop quick screen switcher (hidden on mobile) -->
    <aside class="desktop-sidebar">
      <div class="brand-badge">
        <img src="assets/sticker_skull.jpg" alt="EMO Bank" class="brand-skull" />
        <div>
          <div class="brand-title">xX_EMO_BANK_Xx</div>
          <div class="brand-sub">Интерактивный прототип · 12 экранов</div>
        </div>
      </div>

      <div class="side-group">
        <div class="side-label">Основные вкладки</div>
        <button class="side-btn" data-go="home">01. Главная</button>
        <button class="side-btn" data-go="payments">02. Платежи</button>
        <button class="side-btn" data-go="chats">03. Чаты и уведомления</button>
        <button class="side-btn" data-go="services">04. Сервисы (Хаб)</button>
      </div>

      <div class="side-group">
        <div class="side-label">Экосистема сервисов</div>
        <button class="side-btn" data-go="maps">05a. Карты и транспорт</button>
        <button class="side-btn" data-go="taxi">05b. Такси</button>
        <button class="side-btn" data-go="fitness">06. Фитнес</button>
        <button class="side-btn" data-go="internet">07. Интернет-провайдер</button>
        <button class="side-btn" data-go="profi">08. Услуги и мастера</button>
        <button class="side-btn" data-go="marketplace">09. Маркетплейс</button>
        <button class="side-btn" data-go="courses">10. Допобразование</button>
        <button class="side-btn" data-go="medicine">11. Медицина</button>
      </div>
    </aside>

    <!-- Phone Shell -->
    <main class="phone-frame" id="phoneFrame">
      <!-- Signature 2007 Emo Black & Hot-Pink Checkerboard Strip -->
      <div class="checkerboard-strip" aria-hidden="true"></div>

      <!-- Dynamic Screen Viewport -->
      <div class="screen-viewport" id="screenViewport"></div>

      <!-- Bottom Navigation Slot (4-tab Bank bar / 4-tab Maps bar / 5-tab Marketplace bar / Home bar) -->
      <div id="bottomBarSlot"></div>

      <!-- Floating Virtual Assistant Button (Bank pages only) -->
      <button class="assistant-fab" id="assistantFab" onclick="go('assistant')" title="MoLLy_2007 — виртуальный помощник" aria-label="MoLLy_2007 — виртуальный помощник">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
          <circle cx="9" cy="12" r="1.2" fill="#ff1493"/>
          <circle cx="12.5" cy="12" r="1.2" fill="#ff1493"/>
          <circle cx="16" cy="12" r="1.2" fill="#ff1493"/>
        </svg>
        <span class="assistant-fab-dot"></span>
      </button>

      <!-- Toast Notification -->
      <div class="toast" id="toast"></div>

      <!-- Modal Overlay (Top-up, Transfer, QR, Chat Dialog) -->
      <div class="modal-backdrop" id="modalBackdrop">
        <div class="modal-sheet" id="modalSheet"></div>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
